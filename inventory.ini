[dns]
dns ansible_host=192.168.1.8 ansible_user=root

[nfs]
nfs ansible_host=192.168.1.9 ansible_user=root

[haproxy]
haproxy ansible_host=192.168.1.15 ansible_user=root

[ansible]
ansible ansible_host=192.168.1.13 ansible_user=root  

[vcenter]
vcenter ansible_host=192.168.1.10 ansible_user=root ansible_password='{{ vcenter_password }}'

[okd_nodes]
bootstrap ansible_host=192.168.1.30
master01 ansible_host=192.168.1.31
master02 ansible_host=192.168.1.32
master03 ansible_host=192.168.1.33
worker01 ansible_host=192.168.1.34

[infra:children]
dns
haproxy
ansible

[rhel:children]
dns
haproxy
ansible
nfs

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
