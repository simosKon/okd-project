infrastructure_okd:
  load_balancer_vips:
    - ip: "192.168.1.50"
      name: "api.okd.lab.local"
    - ip: "192.168.1.51"
      name: "apps.okd.lab.local"

  bootstrap:
    ip: "192.168.1.30"
    hostname: "bootstrap.okd.lab.local"

  master:
    - ip: "192.168.1.31"
      hostname: "master01.okd.lab.local"
    - ip: "192.168.1.32"
      hostname: "master02.okd.lab.local"
    - ip: "192.168.1.33"
      hostname: "master03.okd.lab.local"

  worker:
    - ip: "192.168.1.34"
      hostname: "worker01.okd.lab.local"

okd:
  cluster_name: "okd"
  base_domain: "lab.local"
  version: "4.18.0-okd-scos.10"
  base_dir: "/opt/okd"
  install_dir: "/opt/okd/clusters/{{ okd.cluster_name }}/install"
  tools_dir: "/opt/okd/tools"
  terraform_dir: "/opt/okd/clusters/{{ okd.cluster_name }}/terraform/okd"
  reports_dir: "/opt/okd/clusters/{{ okd.cluster_name }}/reports"
  ssh_public_key: "ssh-rsa  root@ansible.test.local"
  pull_secret: "{{ vault_okd_pull_secret | default('' ) }}"
