metadata:
  name: "okd-3m1w-unified"
  description: "UPI OKD project for 3 masters + 1 worker"

network:
  base: "192.168.1"
  prefix: "24"
  gateway: "192.168.1.254"
  domain: "lab.local"
  dns_servers:
    - "192.168.1.8"
  ntp_server: "192.168.1.14"

storage_backend: "nfs"  # supported: nfs, vsan

infrastructure_core:
  dns_server:
    ip: "192.168.1.8"
    hostname: "dns.lab.local"

  nfs_server:
    ip: "192.168.1.170"
    hostname: "nfs.lab.local"
    datastore_name: "VMs"

  haproxy_server:
    ip: "192.168.1.15"
    hostname: "haproxy.lab.local"
    interface: "ens192"  # optional override; if empty, first active non-loopback interface is used

  ad_server:
    ip: "192.168.1.14"
    hostname: "ad.lab.local"

  ansible_server:
    ip: "192.168.1.13"
    hostname: "ansible.lab.local"
    ansible_admin_ssh_key: "ssh-rsa  root@ansible.test.local"

infrastructure_packer:
  host:
    ip: "192.168.1.13"
    hostname: "ansible.lab.local"
  http:
    port_min: 8600
    port_max: 8610

# required only when ad_join_enabled=true or sssd_conf_enabled=true
sssd_svc:
  domain_name: "lab.local"
  krb5_realm: "LAB.LOCAL"
  krb5_kdc: "192.168.1.14"
  id_provider: "ad"
  access_provider: "ad"
  auth_provider: "ad"
  chpass_provider: "ad"

platform_roles:
  sub_manager_enabled: true
  install_initial_packages_enabled: true
  ansible_user_enabled: true
  ntp_conf_enabled: true
  ad_join_enabled: true
  sssd_conf_enabled: true
  vcenter_deploy_enabled: true
  vcenter_configure_enabled: true
  vcenter_create_datacenter_enabled: true
  vcenter_create_clusters_enabled: true
  vcenter_configure_clusters_enabled: true
  vcenter_configure_networks_enabled: false
  vcenter_configure_vds_enabled: true
  vcenter_configure_vmkernel_enabled: true
  vcenter_add_esxi_hosts_enabled: true
  vcenter_join_esxi_cluster_enabled: true
  vcenter_create_nfs_datastore_enabled: true
  vcenter_create_vsan_datastore_enabled: false
  vcenter_add_licenses_enabled: true
  nfs_lvm_enabled: false
  nfs_conf_enabled: false

# firewall profiles used by roles/firewall_conf
firewall:
  services:
    dns:
      - dns
    ansible: []
    haproxy: []
    nfs: []

  ports:
    dns:
      tcp: [53]
      udp: [53]
    ansible:
      tcp: [8600, 8601, 8602, 8603, 8604, 8605, 8606, 8607, 8608, 8609, 8610]
      udp: []
    haproxy:
      tcp: [6443, 22623, 80, 443]
      udp: []
    nfs:
      tcp: [111, 2049, 20048]
      udp: [111, 2049, 20048]
    sssd_global:
      tcp: [88, 389, 636, 464]
      udp: [88, 389, 464]

# haproxy stats endpoint credentials (lab defaults)
haproxy:
  stats_port: 8404
  stats_user: "{{ vault_haproxy_stats_username | default('' ) }}"
  stats_password: "{{ vault_haproxy_stats_password | default('' ) }}"

nfs_vm_storage:
  pv_disks:
    - /dev/sdb
  vg_name: "vg1"
  lv_name: "vmware_data"
  lv_size: "100%FREE"
  fs_type: "xfs"
  mount_path: "/nfs"
  export_path: "/nfs"
